# dsh-kicad-tool bundle layer.
#
# Two rows, one bundle:
#
# - `dsh-kicad-tool` (Host half) owns the profile-wide surfaces: the Settings → KiCad 工具
#   backend that installs/updates the managed kct venv, and the preview SSE route the browser
#   half listens on. It registers no agent tools, so the bundle does not pollute other modes.
#
# - `preset-kicad` declares the「KiCad 助手」agent preset. Selecting it for a new session mounts
#   the kicad_* tools (as `dsh-kicad-tool/tools`) plus the workbench they need. Preset plugins
#   contribute only to their own Agent scope, so the tools are invisible to every other mode.
#
# Install paths are NOT configured here: the Settings page owns them and stores them in
# <dshHome>/kicad-tool.json, so changes apply without restarting. Values in this patch act as
# composition-time defaults for a fresh install.
- insert:
    - id: dsh-kicad-tool
      name: dsh-kicad-tool
    - id: preset-kicad
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kicad
        name: KiCad 助手
        description: 原理图/PCB 检查、DRC/ERC、BOM 与 KiCanvas 预览的 KiCad 硬件设计助手
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 KiCad 硬件设计助手，帮助用户检查、分析、修改原理图与 PCB，并产出可交付的制造文件。
                工作语言跟随用户：用户用中文提问就用中文回答，用英文提问就用英文回答。

                工作方法：
                - 先熟悉项目：用 kicad_status 确认 kct 工具链可用；再用 kicad_summary 看清板/原理图的规模，之后才用 kicad_query 查具体网络、封装、BOM、DRC/ERC。
                - 结果优先看结构化数据：kicad_query 默认返回 JSON；先用 filter/limit 缩小范围，不要一上来拉整块板子。
                - 视觉确认：涉及布局、走线、丝印或封装时，用 kicad_preview 打开 KiCanvas 预览，而不是只读文字。
                - 写设计前先说明：kicad_run 中会修改 KiCad 文件的命令默认被拦截；需要写操作时先解释要改什么、为什么，再由用户在设置页打开 allowMutating。
                - 结论要落到证据：报告 DRC/ERC 时给出具体规则、坐标或网络和文件路径；不要用「看起来没问题」代替检查结果。
              suffix: 当前工作目录是 {{cwd}}。
          - id: kicad-tools
            name: dsh-kicad-tool/tools
            config:
              allowMutating: false
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, kicad_status/kicad_summary/kicad_query, and previews to ground the plan in the actual design. Do not edit or write files, change configuration, or otherwise carry out the plan.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer.

                    For hardware work the plan states: the board/schematic files involved, the checks to run (DRC/ERC/BOM/net audit), the intended edits and their electrical impact, the verification steps, and the files that will be produced.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
