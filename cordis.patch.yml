# dsh-kicad-tool bundle layer.
#
# Declared via the `dsh.bundle.patch` manifest in package.json, so
# `dsh plugin --profile <name> add dsh-kicad-tool` mounts this row automatically.
#
# Install paths are NOT configured here: the Settings page owns them and stores them in
# <dshHome>/kicad-tool.json, so changes apply without restarting. Values in this patch act as
# composition-time defaults for a fresh install.
- insert:
    - id: dsh-kicad-tool
      name: dsh-kicad-tool
      config:
        allowMutating: false
